<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmirkyToaster | Theme Draft</title>
    <meta
      name="description"
      content="A vapourwave-inspired portfolio theme draft for SmirkyToaster."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>
    <div class="bg-grid"></div>

    <main class="stage">
      <header class="topbar">
        <span class="brand">SmirkyToaster</span>
        <div class="topbar-actions">
          <span class="status-pill">Theme draft</span>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle colour theme">
            <span class="theme-toggle__label">Dark mode</span>
            <span class="theme-toggle__icon"></span>
          </button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Vapourwave • Pink • Experimental</p>
          <h1>Portfolio theme exploration</h1>
          <p class="subtitle">
            A soft neon shell for a future showcase. Content will arrive later;
            this first pass is all about mood.
          </p>
        </div>

        <div class="preview-card" aria-label="Theme preview">
          <div class="preview-card__header">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="preview-card__body">
            <div class="panel panel-large"></div>
            <div class="panel-row">
              <div class="panel panel-small"></div>
              <div class="panel panel-small"></div>
            </div>
            <div class="panel panel-wide"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const storageKey = "smirky-theme";
      const toggleButton = document.getElementById("theme-toggle");
      const toggleLabel = toggleButton?.querySelector(".theme-toggle__label");

      const applyTheme = (theme) => {
        document.body.setAttribute("data-theme", theme);
        localStorage.setItem(storageKey, theme);

        if (toggleLabel) {
          toggleLabel.textContent = theme === "dark" ? "Light mode" : "Dark mode";
        }
      };

      const savedTheme = localStorage.getItem(storageKey);
      applyTheme(savedTheme === "dark" ? "dark" : "light");

      toggleButton?.addEventListener("click", () => {
        const nextTheme = document.body.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
      });
    </script>
  </body>
</html>
